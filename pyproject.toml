[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-witness"
version = "0.1.0"
description = "Same head unittest, two Git snapshots, per-test assertion-failure-to-pass evidence."
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
patch-witness = "patch_witness.__main__:main"

[tool.setuptools]
packages = ["patch_witness"]
